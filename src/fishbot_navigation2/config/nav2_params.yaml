bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker" #行为树
      xy_goal_tolerance: 0.15 #到目标点的位置误差阈值
      yaw_goal_tolerance: 0.15 #到目标点的朝向误差阈值
    # ============================================================================
    # 局部控制器：MPPI（移植自 SCURM_Nav_Tutorial 哨兵导航的 MPPI 调参方案，
    # 按 fishbot 差速底盘重新标定：运动模型 DiffDrive、限速 0.26m/s / 0.8rad/s、
    # 膨胀半径 0.55m 对应的避障权重。实测 8 核机器 20Hz 可跑满，0 次掉周期）
    # 如需切回 DWB，把下面注释块解开、并把 MPPI 段注释掉即可。
    # ----------------------------------------------------------------------------
    # DWB parameters（原配置，保留备查）
    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   debug_trajectory_details: True
    #   min_vel_x: 0.0
    #   max_vel_x: 0.26
    #   max_vel_theta: 0.8
    #   min_speed_xy: 0.0
    #   max_speed_xy: 0.26
    #   min_speed_theta: 0.0
    #   acc_lim_x: 2.5
    #   acc_lim_theta: 2.0
    #   decel_lim_x: -2.5
    #   decel_lim_theta: -3.2
    #   vx_samples: 20
    #   vtheta_samples: 20
    #   sim_time: 1.7
    #   linear_granularity: 0.05
    #   angular_granularity: 0.025
    #   transform_tolerance: 0.2
    #   xy_goal_tolerance: 0.15
    #   trans_stopped_velocity: 0.25
    #   short_circuit_trajectory_evaluation: True
    #   stateful: True
    #   critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    #   BaseObstacle.scale: 0.02
    #   PathAlign.scale: 32.0
    #   PathAlign.forward_point_distance: 0.1
    #   GoalAlign.scale: 24.0
    #   GoalAlign.forward_point_distance: 0.1
    #   PathDist.scale: 32.0
    #   GoalDist.scale: 24.0
    #   RotateToGoal.scale: 32.0
    #   RotateToGoal.slowing_factor: 5.0
    #   RotateToGoal.lookahead_time: -1.0
    # ----------------------------------------------------------------------------
    # MPPI parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 预测时域 = time_steps x model_dt = 56 x 0.05 = 2.8s（与教程一致）
      time_steps: 56
      model_dt: 0.05          # = 1/controller_frequency(20Hz)
      batch_size: 1000        # 每周期采样轨迹数；教程注释：1000@50Hz 或 2000@30Hz
                              # 本机实测 1000 稳定跑满 20Hz，1500 也可以；加大能提升质量但吃 CPU
      vx_std: 0.2             # 采样标准差；预测时域 x vx_max = 0.73m，远小于局部代价地图 3x3m
      vy_std: 0.0             # 差速底盘：无横移自由度（教程 Omni 麦轮为 0.3）
      wz_std: 0.4
      vx_max: 0.26            # 与底层 diff_drive_controller、velocity_smoother 上限一致
      vx_min: 0.0             # 不倒退，与原 DWB 的 min_vel_x 一致；允许倒退可改 -0.1
      vy_max: 0.0             # 差速底盘必须为 0
      wz_max: 0.8
      iteration_count: 1      # 教程：保持 1，靠加大 batch_size 提升而非迭代次数
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3        # 越小越贴最优轨迹，越大越平滑
      gamma: 0.015            # 平滑度/能耗权衡；教程用 0.065（大场地），小车小场地用默认值更跟手
      motion_model: "DiffDrive"  # 教程为 Omni；fishbot 是差速，必须改
      visualize: false        # 置 true 会在 RViz 画采样轨迹，但明显拖慢计算
      reset_period: 1.0       # 仅 Humble：多久无新目标后重置优化器
      regenerate_noises: false
      retry_attempt_limit: 3  # 失败后软重置重试次数
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # 与原 DWB critics 的对应关系：
      #   BaseObstacle -> ObstaclesCritic，GoalAlign -> GoalCritic/GoalAngleCritic，
      #   PathAlign/PathDist -> PathAlignCritic/PathFollowCritic，
      #   RotateToGoal/Oscillation -> 由 MPPI 自身平滑与 GoalAngleCritic 替代
      # 未启用 TwirlingCritic：它用于抑制全向底盘原地打转，差速车靠转向跟踪路径，启用反而有害
      critics: ["ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5        # 教程为 0.4，是配 5m 膨胀半径的；半径越小权重应越大，
        critical_weight: 20.0        # 教程为 10.0，同理。这里取与 0.55m 膨胀半径匹配的量级
        consider_footprint: false    # 打开可提升避障精度但增加计算量，需先配 footprint 多边形
        collision_cost: 10000.0      # 教程为 10.0（与其 5m 膨胀场配套）；0.55m 半径下必须放大
        collision_margin_distance: 0.1  # 教程：0.05~0.2 合理，且必须小于需要通过的通道宽度
        near_goal_distance: 0.5      # 距目标这么近时不再被障碍物排斥，保证能贴到靠墙的目标点
        inflation_radius: 0.55       # 必须与 local_costmap 的 inflation_layer 一致（Humble）
        cost_scaling_factor: 3.0     # 同上
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5   # 距目标 0.5m 内改由目标类 critic 主导
      GoalAngleCritic:              # 教程原配置没有（哨兵 yaw 容差 3.14，不在乎末端朝向）；
        enabled: true               # 本工程 goal_checker 的 yaw 容差是 0.15，必须有它才能收敛
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20     # 与预测时域/最大速度/路径分辨率相关的经验值
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5
      PathAngleCritic:              # 教程为 false（麦轮哨兵多横向平移）；
        enabled: true               # 差速车靠转向跟踪路径，开启更好
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0 # MPPI 每个控制周期(20Hz)都会读代价地图，5Hz 太旧，提到 10Hz
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3 #代价膨胀
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    # 全局规划器：Theta*（任意角度路径，长直线 + 在障碍拐点切角；实测可用）
    # 如需切回 Navfn，把下面注释块解开、注释掉 Theta* 段即可
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
    #   tolerance: 0.5
    #   use_astar: false
    #   allow_unknown: true
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8              # 只支持 4 或 8，填其他值会被强制改成 8
      w_euc_cost: 1.0                  # 欧氏距离代价权重
      w_traversal_cost: 2.0            # 穿越高代价区（膨胀区）的权重，切角离障碍太近就调大到 3~5
      allow_unknown: true
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
